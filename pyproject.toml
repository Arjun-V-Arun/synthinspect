[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthinspect"
version = "0.1.0"
description = "Few-shot visual inspection with synthetic defects: RGCB-style NST vs DefectFill vs MAGIC, explained and shipped small."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Arjun V. Arun" }]
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pyyaml>=6",
  "scipy>=1.11",
  "torch>=2.4",
  "torchvision>=0.19",
  "ultralytics>=8.4.200",
  "onnx>=1.16",
  "onnxruntime>=1.20",
  "onnxconverter-common>=1.14",
  "openvino>=2025.3",
  "nncf>=2.18",
]

[project.optional-dependencies]
gen = ["diffusers>=0.35", "transformers>=4.45", "peft>=0.17", "accelerate>=1.0", "lpips>=0.1.4", "safetensors>=0.4"]
rfdetr = ["rfdetr[train]>=1.10"]
serve = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "scikit-learn>=1.4", "httpx>=0.27", "playwright>=1.48"]

[project.scripts]
synthinspect = "synthinspect.cli:main"

[tool.setuptools.packages.find]
include = ["synthinspect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
