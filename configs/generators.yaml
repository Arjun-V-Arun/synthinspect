# Generator settings. Change these, not the code.

copypaste:
  # The RGCB pipeline without its style-transfer step, so rgcb vs copypaste isolates what NST adds.
  blend: radial               # Gaussian-faded square patch, as the RGCB generator pastes colonies
  radial_sigma: 0.8           # RGCB value
  radial_pad: 0.25            # margin around the defect so it sits in the bright middle of the fade
  context: 8

rgcb:
  # Mirrors the generator used at RGCB (Pawlowski et al., Sci. Rep. 2022;
  # github.com/jarek-pawlowski/microbial-dataset-generation): real defects pasted onto clean
  # parts with a Gaussian fade, then the WHOLE image restyled toward a clean part with
  # photorealistic HRNet style transfer (Li et al. 2019), warm-started image to image.
  scope: global               # confirmed: whole images were restyled
  style_source: normal        # confirmed: style images were clean plates (here: good parts)
  blend: radial
  radial_sigma: 0.8
  radial_pad: 0.25
  nst_method: hrnet           # "gatys" switches to pixel-optimisation NST for comparison
  nst:
    size: 640                 # long side during style transfer; the detector trains at 640
    steps: 500                # RGCB value
    lr: 0.005                 # RGCB value
    lr_step: 200              # RGCB value
    lr_gamma: 0.9             # RGCB value
    content_weight: 150.0     # RGCB value
    style_weight: 0.5         # RGCB value
    warm_start: true          # RGCB: each image starts from the previous image's network

# Both diffusion methods share one backbone so they differ only where the papers differ.
# The official stabilityai SD 2 repos return 404 since Nov 2025, so this uses the maintained
# SD 1.5 inpainting mirror. Any diffusers-format 9-channel inpainting model works here.
defectfill:
  base_model: sd-legacy/stable-diffusion-inpainting
  sample_steps: 30
  guidance: 7.5
  lfs_candidates: 4           # the paper uses 8; 4 halves generation time
  train:
    steps: 1500               # not stated in the paper
    rank: 8                   # paper
    lr_unet: 2.0e-4           # paper
    lr_text: 4.0e-5           # paper
    lambda_def: 0.5           # paper
    lambda_obj: 0.2           # paper
    lambda_attn: 0.05         # paper
    obj_background_weight: 0.3  # paper says only "alpha < 1"
    grad_accum: 1

magic:
  base_model: sd-legacy/stable-diffusion-inpainting
  sample_steps: 30
  w_d: 7.5                    # paper: guidance outside the defect
  w_m: 4.0                    # paper: minimum guidance inside the defect
  train:
    steps: 2000               # paper: 5000 full-DreamBooth steps at batch 4; LoRA here
    rank: 16                  # deviation: LoRA instead of full fine-tuning (8 GB GPU)
    lr_unet: 1.0e-4
    gpp_sigma: 1.0            # paper
    grad_accum: 4             # effective batch 4, as in the paper
